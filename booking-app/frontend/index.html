<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    nav { background: white; padding: 20px; margin-bottom: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    nav h1 { color: #333; font-size: 24px; }
    nav button { padding: 10px 20px; border: none; background: #3b82f6; color: white; border-radius: 6px; cursor: pointer; }
    .auth-section { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .auth-section h2 { margin-bottom: 30px; color: #333; }
    .auth-section form { margin-bottom: 20px; }
    .auth-section input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
    .dashboard { display: grid; gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { margin-bottom: 15px; color: #333; }
    button { padding: 10px 20px; border: none; background: #10b981; color: white; border-radius: 6px; cursor: pointer; }
    .appointments-list { list-style: none; }
    .appointments-list li { padding: 15px; background: #f9fafb; margin-bottom: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
